<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img class="logo" src="imagenes/logo.png" draggable="false" alt="Logo">
        </div>
        <div class="select-container">
            <select class="select-box">
                <option value="">Tipos</option>
                <option value="1">Grandes</option>
                <option value="2">Pequeños</option>
                <option value="3">Medianos</option>
            </select>
            <div class="icon-container">
                <img class="icon" src="imagenes/flecha.png" draggable="false" alt="flecha">
            </div>
        </div>
        <div class="zones-container">
            <nav class="zones">
                <ul class="links-container">
                    <li>Inicio</li>
                    <li>Productos</li>
                    <li>Colección</li>
                    <li>Cuenta</li>
                </ul>
            </nav>
        </div>
    </header>
</body>
</html>
